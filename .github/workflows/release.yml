name: Release

# 为什么要有这个文件：v0.1.2 是手工打包、手工上传 Release、手工写 SHA256，
# 结果文案里的哈希和真实文件对不上，winget 清单也会因为哈希错误被 CI 打回。
# 这里把「版本 → 三平台构建 → 打包 → 算哈希 → 写 Release 文案 → 出 winget 清单 → 发布」串成一条链，
# 哈希一律从真实产物现算，不再由人手抄。
#
# 触发：push 一个 v* tag；或在 Actions 里手动跑 workflow_dispatch（用 package.json 的版本）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == v* ]]; then
            ver="${tag#v}"
            if [ "$ver" != "$pkg" ]; then
              echo "tag $tag 与 package.json $pkg 不一致，先改版本再打 tag" >&2
              exit 1
            fi
          else
            ver="$pkg"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "发布版本 v$ver"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # CI 没有签名证书：跳过自动发现证书，产出未签名包（正式分发需在 secrets 里配证书并去掉这一行）
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单测（Windows 全量）
        if: matrix.platform == 'win'
        run: npm test

      - name: 打包
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm run dist
            npm run dist:installer || echo "NSIS 打包失败，portable 照常发布"
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi

      - name: 计算 SHA256
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          for f in *.exe *.dmg *.zip *.AppImage *.deb; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la *.exe *.dmg *.zip *.AppImage *.deb *.sha256 2>/dev/null || true

      - name: 生成 Release 文案与 winget 清单（Windows）
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          node packaging/make-release-notes.mjs --version ${{ needs.version.outputs.version }}
          node packaging/winget/render.mjs --version ${{ needs.version.outputs.version }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.sha256
            release/RELEASE_NOTES.md
          if-no-files-found: error

      - name: 上传 winget 清单（Windows）
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ needs.version.outputs.version }}
          path: packaging/winget/${{ needs.version.outputs.version }}/
          if-no-files-found: warn

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 汇总产物
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sha256' \) -exec cp {} out/ \;
          ls -la out

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ needs.version.outputs.version }}"
          notes=$(find dist -name 'RELEASE_NOTES.md' | head -1)
          if [ -z "$notes" ]; then
            echo '暂无 Release 文案' > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖资产并刷新文案"
            gh release upload "$tag" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/* --title "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
